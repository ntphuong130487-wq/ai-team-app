name: Hybrid foundation validation
on:
  push:
    branches:
      - feature/hybrid-orchestration-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experimental/hybrid/orchestrator.test.mjs
